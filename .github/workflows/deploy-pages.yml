name: Deploy YUK to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-yuk-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAeB1h_e7ms2nYuMIQoe5EFjzcp1aiCs3g
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: yuka-c4045.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: yuka-c4045
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: yuka-c4045.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "971993651917"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:971993651917:web:7708cfd99439e651dfe784
        run: npm run build || (sleep 5 && npm run build)

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
